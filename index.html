<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Montana Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #134e4a, #064e3b, #022c22);
      background-attachment: fixed;
      min-height: 100vh;
      width: 100vw;
      overflow-y: auto;
      overflow-x: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 35px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #a7f3d0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 6px rgba(52, 211, 153, 0.35); }
      50% { text-shadow: 0 0 16px rgba(52, 211, 153, 0.9); }
    }
    .brand i { animation: pulseGlow 2.6s ease-in-out infinite; color: #34d399; }

    /* الساعة الرقمية */
    .clock-box {
      text-align: center;
      line-height: 1.1;
    }
    .clock-time {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ecfdf5;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.55);
    }
    .clock-date {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .top-actions i {
      font-size: 16px;
      cursor: pointer;
      color: #ecfdf5;
      transition: all 0.2s ease;
    }

    .top-actions i:hover {
      transform: scale(1.15);
      color: #34d399;
    }

    /* Dashboard Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-gap: 12px;
      flex: 1;
      min-height: 280px;
      margin: 8px 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card:hover, .card:focus {
      background: rgba(52, 211, 153, 0.25);
      border-color: #34d399;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(52, 211, 153, 0.25);
      outline: none;
    }

    .card i { font-size: 34px; margin-bottom: 6px; color: #ffffff; }
    .card span { font-size: 15px; font-weight: bold; color: #ffffff; }

    .sub-grid { display: grid; grid-template-rows: 2fr 1fr 1fr; gap: 8px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-2 .card i, .sub-grid .card i { font-size: 18px; margin-bottom: 0; margin-left: 6px; }
    .row-2 .card, .sub-grid .card { flex-direction: row; }

    /* Bottom Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #a7f3d0;
      min-height: 30px;
      flex-shrink: 0;
    }

    /* قائمة اختيار السيرفرات */
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.95) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-content { animation: modalPop 0.22s ease; }

    .pl-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: 0.15s;
    }
    .pl-item:hover { border-color: #34d399; background: rgba(52, 211, 153, 0.12); }
    .pl-item.active { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.35); }
    .pl-item-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .pl-dot { width: 9px; height: 9px; border-radius: 50%; background: #556; flex-shrink: 0; }
    .pl-item.active .pl-dot { background: #34d399; box-shadow: 0 0 6px #34d399; }
    .pl-item-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .pl-item-info b { font-size: 13px; color: #fff; }
    .pl-item-info span { font-size: 10px; color: rgba(255,255,255,0.5); direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl-item-actions i { font-size: 13px; padding: 6px; color: rgba(255,255,255,0.55); cursor: pointer; }
    .pl-item-actions i:hover { color: #f87171; }

    .playlist-info p span { color: #ffffff; font-weight: bold; }

    .btn-circle {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(5px);
      font-size: 12px;
    }
    .btn-circle:hover { background: #34d399; color: #064e3b; }

    /* Player Interface */
    .view-screen {
      display: none; position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #022c22; z-index: 1000;
      flex-direction: column; padding: 10px 15px;
    }

    .player-header {
      display: flex; justify-content: space-between; align-items: center;
      height: 32px; border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px; margin-bottom: 8px;
    }

    .player-header h3 { font-size: 15px; }

    .player-body {
      display: flex;
      gap: 10px;
      height: calc(100vh - 60px);
      width: 100%;
    }

    .panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow-y: auto;
      padding: 6px;
    }

    #categoriesContainer { width: 220px; flex-shrink: 0; }
    #channelsContainer { flex: 1; }

    .panel-item {
      padding: 8px 10px; border-radius: 6px; margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.03); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: 0.15s; font-size: 12px;
    }

    .panel-item:hover, .panel-item.active {
      background: #34d399; color: #064e3b; font-weight: bold;
    }

    /* Video Player Box الثابت والظاهر كلياً */
    .video-container {
      width: 380px;
      height: 100%;
      flex-shrink: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(52, 211, 153, 0.4);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    .placeholder-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #34d399;
      font-size: 13px;
      opacity: 0.7;
    }

    /* Fullscreen Mode */
    .video-container.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 9999; border-radius: 0; border: none;
    }

    .expand-hint {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.7); padding: 3px 6px;
      border-radius: 4px; font-size: 10px; pointer-events: none; color: #fff;
    }

    /* Modals & Loading */
    .modal {
      display: none; position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 47, 38, 0.9); backdrop-filter: blur(10px);
      justify-content: center; align-items: center; z-index: 2000;
    }

    .modal-content {
      background: #064e3b; padding: 18px; border-radius: 12px;
      width: 340px; border: 1px solid #34d399;
    }

    .modal-content h3 { font-size: 15px; }

    .input-group { margin-bottom: 8px; }
    .input-group input {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid #047857; background: #022c22; color: #fff; outline: none;
      font-size: 12px;
    }

    .btn-submit {
      width: 100%; padding: 8px; background: #34d399; color: #064e3b;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
      font-size: 13px;
    }

    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 44, 34, 0.95); z-index: 3000;
      flex-direction: column; justify-content: center; align-items: center;
    }

    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #34d399; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand"><i class="fa-solid fa-tv"></i> Montana Player</div>
    <div class="clock-box">
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-date" id="clockDate">—</div>
    </div>
    <div class="top-actions">
      <i class="fa-solid fa-plus" onclick="openAddModal()" title="إضافة سيرفر"></i>
      <i class="fa-solid fa-list-check" onclick="openPlaylistsModal()" title="إدارة القوائم"></i>
    </div>
  </div>

  <!-- Dashboard Grid -->
  <div class="main-grid">
    <div class="sub-grid">
      <div class="card" onclick="openPlayerView('live')" tabindex="1"><i class="fa-solid fa-tv"></i><span>Live TV</span></div>
      <div class="card" onclick="openPlayerView('catchup')" tabindex="2"><i class="fa-solid fa-clock-rotate-left"></i><span>Catch Up</span></div>
      <div class="row-2">
        <div class="card" onclick="openPlayerView('fav')" tabindex="3"><i class="fa-solid fa-bookmark"></i><span>Favorites</span></div>
        <div class="card" onclick="openPlaylistsModal()" tabindex="4"><i class="fa-solid fa-list-check"></i><span>Playlists</span></div>
      </div>
    </div>
    <div class="card" onclick="openPlayerView('movies')" tabindex="5"><i class="fa-solid fa-film"></i><span>Movies</span></div>
    <div class="card" onclick="openPlayerView('series')" tabindex="6"><i class="fa-solid fa-clapperboard"></i><span>Series</span></div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="playlist-info">
      <p>Current Playlist: <span id="current-playlist-name">لا يوجد (اضغط + لإضافة سيرفر)</span></p>
    </div>
    <div class="system-controls">
      <button class="btn-circle" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>

  <!-- Full Player View -->
  <div class="view-screen" id="playerView">
    <div class="player-header">
      <h3 id="sectionTitle" style="color: #34d399;">Live TV</h3>
      <button class="btn-circle" onclick="closePlayerView()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="player-body">
      <!-- 1. الأقسام Categories -->
      <div class="panel" id="categoriesContainer"></div>
      
      <!-- 2. القنوات Channels -->
      <div class="panel" id="channelsContainer">
        <p style="text-align:center; opacity:0.5; margin-top:20px; font-size:12px;">اختر قسماً لعرض القنوات</p>
      </div>

      <!-- 3. شاشة المعاينة / الفيديو (ظاهرة وصريحة دائماً) -->
      <div class="video-container" id="videoBox" onclick="toggleFullscreen()">
        <span class="expand-hint">اضغط للتكبير ⛶</span>
        <div class="placeholder-text" id="videoPlaceholder">
          <i class="fa-solid fa-circle-play" style="font-size: 32px;"></i>
          <span>اختر قناة للتشغيل</span>
        </div>
        <video id="mainVideo" controls autoplay style="display:none;"></video>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <h3 style="color:#34d399;">Loading...</h3>
    <p style="opacity:0.8; margin-top:4px; font-size:12px;">جاري جلب القنوات والمحتوى</p>
  </div>

  <!-- Modal: إضافة سيرفر -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="margin-bottom:12px; text-align:center; color:#a7f3d0;">إضافة سيرفر IPTV</h3>
      <div class="input-group"><input type="text" id="pName" placeholder="اسم السيرفر"></div>
      <div class="input-group"><input type="text" id="pUrl" placeholder="Host (http://domain.com:8080)"></div>
      <div class="input-group"><input type="text" id="pUser" placeholder="Username"></div>
      <div class="input-group"><input type="password" id="pPass" placeholder="Password"></div>
      <button class="btn-submit" onclick="saveAndFetchData()">حفظ وجلب البيانات</button>
      <button class="btn-submit" style="background:transparent; color:#fff; margin-top:4px;" onclick="closeModal('addModal')">إلغاء</button>
    </div>
  </div>

  <!-- Modal: اختيار / إدارة السيرفرات -->
  <div class="modal" id="playlistsModal">
    <div class="modal-content" style="width: 360px; max-height: 80vh; overflow-y: auto;">
      <h3 style="margin-bottom:12px; text-align:center; color:#a7f3d0;">السيرفرات المحفوظة</h3>
      <div id="playlistsListContainer"></div>
      <button class="btn-submit" style="margin-top:6px;" onclick="closeModal('playlistsModal'); openAddModal();">+ إضافة سيرفر جديد</button>
      <button class="btn-submit" style="background:transparent; color:#fff; margin-top:4px;" onclick="closeModal('playlistsModal')">إغلاق</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    let playlists = JSON.parse(localStorage.getItem('montana_playlists')) || [];
    let activePlaylist = playlists.find(p => p.active) || null;
    let serverData = { categories: [], streams: [] };
    let hls = new Hls();

    function persistPlaylists() {
      localStorage.setItem('montana_playlists', JSON.stringify(playlists));
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str == null ? '' : str;
      return div.innerHTML;
    }

    // يقبل أي شكل رابط ويطبّعه (يضيف http:// لو ناقص ويشيل / الزيادة في الآخر)
    function normalizeHost(url) {
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
      if (url.endsWith('/')) url = url.slice(0, -1);
      return url;
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function updatePlaylistLabel() {
      document.getElementById('current-playlist-name').innerText =
        activePlaylist ? activePlaylist.name : 'لا يوجد (اضغط + لإضافة سيرفر)';
    }

    function saveAndFetchData() {
      const name = document.getElementById('pName').value.trim();
      let url = document.getElementById('pUrl').value.trim();
      const user = document.getElementById('pUser').value.trim();
      const pass = document.getElementById('pPass').value.trim();

      if (!name || !url || !user || !pass) return alert('الرجاء تعبئة كافة البيانات');

      url = normalizeHost(url);

      const newPl = { name, url, user, pass, active: true };
      playlists.forEach(p => p.active = false);
      playlists.push(newPl);
      activePlaylist = newPl;
      persistPlaylists();

      ['pName', 'pUrl', 'pUser', 'pPass'].forEach(id => document.getElementById(id).value = '');
      updatePlaylistLabel();
      closeModal('addModal');
      serverData = { categories: [], streams: [] };
      fetchAllData();
    }

    /* ===== إدارة عدّة سيرفرات: عرض / تفعيل / حذف ===== */
    function openPlaylistsModal() {
      renderPlaylistsList();
      document.getElementById('playlistsModal').style.display = 'flex';
    }

    function renderPlaylistsList() {
      const container = document.getElementById('playlistsListContainer');
      container.innerHTML = '';
      if (playlists.length === 0) {
        container.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:12px; padding:10px 0;">لا يوجد سيرفرات محفوظة بعد</p>';
        return;
      }
      playlists.forEach((pl, i) => {
        const div = document.createElement('div');
        div.className = 'pl-item' + (pl.active ? ' active' : '');
        div.innerHTML = `
          <div class="pl-item-left">
            <div class="pl-dot"></div>
            <div class="pl-item-info"><b>${escapeHtml(pl.name)}</b><span>${escapeHtml(pl.url)}</span></div>
          </div>
          <div class="pl-item-actions"><i class="fa-solid fa-trash"></i></div>
        `;
        div.querySelector('.pl-item-actions i').onclick = (e) => { e.stopPropagation(); deletePlaylist(i); };
        div.onclick = () => selectPlaylist(i);
        container.appendChild(div);
      });
    }

    function selectPlaylist(i) {
      playlists.forEach(p => p.active = false);
      playlists[i].active = true;
      activePlaylist = playlists[i];
      persistPlaylists();
      updatePlaylistLabel();
      serverData = { categories: [], streams: [] };
      closeModal('playlistsModal');
      fetchAllData();
    }

    function deletePlaylist(i) {
      const wasActive = playlists[i].active;
      playlists.splice(i, 1);
      if (wasActive) {
        activePlaylist = playlists[0] || null;
        if (activePlaylist) activePlaylist.active = true;
      }
      persistPlaylists();
      renderPlaylistsList();
      updatePlaylistLabel();
    }

    function fetchAllData() {
      if(!activePlaylist) return;
      document.getElementById('loadingOverlay').style.display = 'flex';

      const catUrl = `${activePlaylist.url}/player_api.php?username=${activePlaylist.user}&password=${activePlaylist.pass}&action=get_live_categories`;
      const streamUrl = `${activePlaylist.url}/player_api.php?username=${activePlaylist.user}&password=${activePlaylist.pass}&action=get_live_streams`;

      Promise.all([fetch(catUrl).then(r => r.json()), fetch(streamUrl).then(r => r.json())])
        .then(([categories, streams]) => {
          serverData.categories = categories;
          serverData.streams = streams;
          document.getElementById('loadingOverlay').style.display = 'none';
        })
        .catch(err => {
          document.getElementById('loadingOverlay').style.display = 'none';
          alert('حدث خطأ أثناء تحميل البيانات من السيرفر');
        });
    }

    function openPlayerView(type) {
      if(!activePlaylist) { openPlaylistsModal(); return; }
      if(serverData.categories.length === 0) {
        fetchAllData();
        return;
      }
      document.getElementById('playerView').style.display = 'flex';
      renderCategories();
    }

    function closePlayerView() {
      document.getElementById('playerView').style.display = 'none';
      const video = document.getElementById('mainVideo');
      video.pause();
    }

    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      serverData.categories.forEach((cat) => {
        const div = document.createElement('div');
        div.className = 'panel-item';
        div.innerText = cat.category_name;
        div.onclick = () => {
          document.querySelectorAll('#categoriesContainer .panel-item').forE
