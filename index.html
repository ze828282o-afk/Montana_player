<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Montana Player</title>
  <link rel="stylesheet" href="style.css">
  <!-- مكتبة HLS.js لتشغيل البث المباشر -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- أيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="logo"><i class="fa-solid fa-tv"></i> MONTANA PLAYER</div>
      <h3>تسجيل الدخول - Xtream Codes</h3>
      <div class="input-group">
        <i class="fa-solid fa-server"></i>
        <input type="text" id="server-url" placeholder="رابط السيرفر (http://domain.com:8080)">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" placeholder="اسم المستخدم">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="password" placeholder="كلمة السر">
      </div>
      <button id="login-btn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
      <p id="error-msg" class="error-msg"></p>
    </div>
  </div>

  <!-- الواجهة الرئيسية -->
  <div id="app-screen" class="screen hidden">
    <!-- الشريط العلوي لبيانات الاشتراك -->
    <header class="top-bar">
      <div class="brand-title"><i class="fa-solid fa-play"></i> MONTANA</div>
      <div class="user-badge"><i class="fa-solid fa-user-circle"></i> <span id="info-user">-</span></div>
      <div class="info-tag">الحالة: <span id="info-status" class="status-active">-</span></div>
      <div class="info-tag">تاريخ الانتهاء: <span id="info-exp" class="exp-date">-</span></div>
      <div class="info-tag">الأجهزة: <span id="info-conn">-</span></div>
      <button id="logout-btn"><i class="fa-solid fa-power-off"></i> خروج</button>
    </header>

    <div class="main-layout">
      <!-- الشريط الجانبي -->
      <aside class="sidebar">
        <!-- تبويبات: مباشر - أفلام - مسلسلات - مفضلة -->
        <div class="media-tabs">
          <button class="tab-btn active" data-type="live"><i class="fa-solid fa-satellite-dish"></i> مباشر</button>
          <button class="tab-btn" data-type="movie"><i class="fa-solid fa-film"></i> أفلام</button>
          <button class="tab-btn" data-type="series"><i class="fa-solid fa-tv"></i> مسلسلات</button>
          <button class="tab-btn" data-type="fav"><i class="fa-solid fa-star"></i> المفضلة</button>
        </div>

        <!-- البحث وتصفية الأقسام -->
        <div class="filter-box">
          <input type="text" id="search-input" placeholder="بحث عن اسم...">
          <select id="category-select">
            <option value="">جميع الأقسام</option>
          </select>
        </div>

        <!-- قائمة المحتوى -->
        <ul id="content-list" class="content-list"></ul>
      </aside>

      <!-- منطقة المشغل والمعلومات -->
      <main class="player-section">
        <div class="video-wrapper">
          <video id="video-player" controls autoplay></video>
        </div>
        <div class="player-footer">
          <h2 id="current-title">اختر عنصر للبدء</h2>
          <button id="fav-btn" class="fav-action-btn"><i class="fa-regular fa-star"></i> إضافة للمفضلة</button>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
