<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Montana Player</title>
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint-1:#7cf2c0; --mint-2:#34b88a; --mint-3:#0f6b52; --mint-4:#063d2e;
    --glass:rgba(255,255,255,0.13); --glass-strong:rgba(255,255,255,0.22);
    --border:rgba(255,255,255,0.28); --border-strong:rgba(255,255,255,0.5);
    --text:#ffffff; --text-dim:rgba(255,255,255,0.78);
    --glow:rgba(124,242,192,0.55);
    --ok:#7cf2c0; --warn:#ffd166; --danger:#ff6b6b;
    --mono:'Fira Code',monospace; --arb:'Cairo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:var(--arb);
    color:var(--text);
    min-height:100vh; width:100vw;
    overflow-y:auto; overflow-x:hidden;
    direction:rtl;
    background:
      radial-gradient(circle at 12% -5%, #58e6ab 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #12a179 0%, transparent 40%),
      linear-gradient(160deg,#12a179 0%, #0b3d2e 55%, #062a20 100%);
    background-attachment:fixed;
  }
  .bg-decor{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      repeating-radial-gradient(circle at 0% 0%, transparent 0 38px, rgba(255,255,255,0.045) 39px 41px),
      repeating-radial-gradient(circle at 100% 100%, transparent 0 38px, rgba(255,255,255,0.045) 39px 41px);
  }
  .shimmer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .shimmer::after{content:'';position:absolute;top:-50%;left:-60%;width:60%;height:200%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.06), transparent);
    animation:sweep 9s ease-in-out infinite;
  }
  @keyframes sweep{0%{transform:translateX(0);}100%{transform:translateX(260vw);}}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .dashboard{position:relative;z-index:2;min-height:100vh;width:100vw;padding:22px 26px;
    display:flex;flex-direction:column;justify-content:space-between;gap:18px;}

  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--mint-1),var(--mint-2));
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:#063d2e;
    box-shadow:0 0 20px var(--glow);animation:pulseGlow 2.6s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 12px var(--glow);}50%{box-shadow:0 0 26px var(--glow);}}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-logo{font-family:var(--mono);font-weight:700;font-size:1.25rem;letter-spacing:.03em;color:#fff;text-shadow:0 0 14px rgba(124,242,192,.4);}
  .brand-sub{font-size:.68rem;color:var(--text-dim);letter-spacing:.08em;}

  .clock-box{text-align:center;}
  .clock-time{font-family:var(--mono);font-size:1.9rem;font-weight:700;color:#fff;letter-spacing:.03em;
    text-shadow:0 0 16px rgba(124,242,192,.45);}
  .clock-date{font-size:.75rem;color:var(--text-dim);margin-top:2px;}

  .top-actions{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--border);
    border-radius:30px;padding:6px 8px;backdrop-filter:blur(10px);}
  .icon-btn{background:none;border:none;color:#fff;font-size:1.05rem;cursor:pointer;width:38px;height:38px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .icon-btn:hover{background:rgba(255,255,255,.18);box-shadow:0 0 12px var(--glow);}
  .search-wrap{display:flex;align-items:center;gap:4px;}
  .search-input{width:0;opacity:0;background:rgba(0,0,0,.18);border:1px solid var(--border);border-radius:20px;
    color:#fff;padding:0 0;font-family:var(--arb);font-size:.82rem;outline:none;transition:.25s;}
  .search-input.open{width:150px;opacity:1;padding:7px 14px;margin-left:4px;}
  .search-input::placeholder{color:rgba(255,255,255,.55);}

  .cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:720px){ .cards-grid{grid-template-columns:repeat(2,1fr);} }

  .tile{background:var(--glass);border:1px solid var(--border);border-radius:18px;height:150px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    backdrop-filter:blur(10px);transition:all .25s ease;position:relative;overflow:hidden;}
  .tile::before{content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
    background:linear-gradient(135deg,rgba(255,255,255,.5),transparent 40%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;}
  .tile:hover{transform:translateY(-4px);border-color:var(--border-strong);
    box-shadow:0 14px 34px rgba(0,0,0,.28), 0 0 26px var(--glow);background:var(--glass-strong);}
  .tile-icon{font-size:2.6rem;filter:drop-shadow(0 0 10px rgba(124,242,192,.5));}
  .tile-title{font-weight:700;font-size:1.02rem;letter-spacing:.02em;}
  .tile-badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:.62rem;
    background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;padding:2px 7px;color:var(--text-dim);}

  .bottom-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:12px 18px;backdrop-filter:blur(10px);}
  .pl-summary{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--text-dim);}
  .pl-summary strong{color:#fff;}
  .exp-tag{font-family:var(--mono);font-size:.72rem;padding:2px 9px;border-radius:8px;display:inline-block;width:fit-content;margin-top:2px;}
  .exp-tag.ok{background:rgba(124,242,192,.16);color:var(--ok);border:1px solid rgba(124,242,192,.4);}
  .exp-tag.warn{background:rgba(255,209,102,.14);color:var(--warn);border:1px solid rgba(255,209,102,.4);}
  .exp-tag.danger{background:rgba(255,107,107,.14);color:var(--danger);border:1px solid rgba(255,107,107,.4);}
  .footer-note{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;}
  .bottom-icons{display:flex;gap:8px;}

  /* ===== صفحة القوائم ===== */
  .page-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#12a179 0%,#0b3d2e 60%,#062a20 100%);
    z-index:50;display:none;flex-direction:column;padding:24px 28px;overflow-y:auto;}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .page-header h1{font-family:var(--mono);font-size:1.4rem;display:flex;align-items:center;gap:12px;}
  .btn-round{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-strong);
    background:rgba(255,255,255,.12);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.2s;}
  .btn-round:hover{background:var(--mint-2);box-shadow:0 0 16px var(--glow);}

  .pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .pl-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:16px;
    position:relative;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px);}
  .pl-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.22);}
  .pl-card.active{border-color:var(--mint-1);box-shadow:0 0 20px var(--glow);}
  .pl-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .pl-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);margin-top:6px;}
  .pl-card.active .pl-dot{background:var(--mint-1);box-shadow:0 0 8px var(--mint-1);}
  .pl-title{font-weight:700;font-size:1.02rem;}
  .pl-url{font-size:.74rem;color:var(--text-dim);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pl-actions{display:flex;gap:8px;margin-top:4px;}
  .mini-btn{font-size:.72rem;background:rgba(255,255,255,.1);border:1px solid var(--border);border-radius:8px;
    padding:5px 10px;color:#fff;cursor:pointer;}
  .mini-btn:hover{background:rgba(255,255,255,.2);}
  .mini-btn.danger:hover{background:rgba(255,107,107,.25);border-color:rgba(255,107,107,.5);}
  .empty-box{text-align:center;padding:70px 20px;color:var(--text-dim);grid-column:1/-1;}
  .empty-box b{display:block;font-family:var(--mono);color:#fff;margin-bottom:8px;font-size:1rem;}

  /* ===== مودال إضافة قائمة ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(3,20,14,.72);backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;z-index:1000;}
  .modal-box{background:rgba(9,40,30,.92);border:1px solid var(--border-strong);border-radius:18px;
    width:90%;max-width:520px;padding:28px;box-shadow:0 0 50px rgba(124,242,192,.18);animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
  .modal-title{text-align:center;font-weight:800;font-size:1.35rem;margin-bottom:4px;}
  .modal-sub{text-align:center;font-size:.76rem;color:var(--text-dim);margin-bottom:22px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;text-align:right;}
  .field label{font-size:.74rem;color:var(--mint-1);font-weight:700;}
  .field input{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;padding:11px 14px;
    color:#fff;font-size:.88rem;outline:none;direction:ltr;transition:.2s;font-family:var(--arb);}
  .field input:focus{border-color:var(--mint-1);box-shadow:0 0 10px var(--glow);}
  .field input::placeholder{color:rgba(255,255,255,.35);}
  .form-error{grid-column:1/-1;text-align:center;font-size:.76rem;color:var(--danger);min-height:1em;}
  .form-btns{grid-column:1/-1;display:flex;gap:10px;margin-top:6px;}
  .btn-primary{flex:1;background:linear-gradient(135deg,var(--mint-1),var(--mint-2));color:#063d2e;border:none;
    padding:13px;font-weight:800;border-radius:10px;cursor:pointer;font-size:.9rem;transition:.2s;
    box-shadow:0 4px 18px rgba(124,242,192,.35);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:.6;cursor:wait;}
  .btn-ghost{background:rgba(255,255,255,.08);color:var(--text-dim);border:1px solid var(--border);
    padding:13px 20px;border-radius:10px;cursor:pointer;font-size:.85rem;}
  .btn-ghost:hover{color:#fff;}

  /* ===== واجهة المشغل ===== */
  .content-view{position:fixed;inset:0;background:#052620;z-index:80;display:none;flex-direction:row;}
  .sidebar-mini{width:60px;background:rgba(6,38,29,.9);border-left:1px solid var(--border);display:flex;
    flex-direction:column;align-items:center;padding:16px 0;gap:18px;}
  .categories-panel{width:175px;background:rgba(4,28,21,.9);border-left:1px solid var(--border);overflow-y:auto;
    padding:10px 5px;display:flex;flex-direction:column;gap:4px;}
  .cat-item{padding:10px 12px;font-size:.8rem;border-radius:8px;cursor:pointer;color:var(--text-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat-item.active,.cat-item:hover{background:rgba(124,242,192,.16);color:var(--mint-1);font-weight:700;}
  .items-panel{flex:1;display:flex;flex-direction:column;background:#031a14;}
  .items-grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
    gap:12px;align-content:start;}
  .grid-card{background:var(--glass);border-radius:12px;padding:9px;text-align:center;cursor:pointer;
    border:1px solid var(--border);transition:.2s;}
  .grid-card:hover{border-color:var(--mint-1);box-shadow:0 0 14px var(--glow);transform:translateY(-2px);}
  .grid-card img{width:100%;height:64px;object-fit:contain;background:#000;border-radius:8px;}
  .grid-card span{font-size:.74rem;margin-top:6px;display:block;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:#fff;}
  .player-wrapper{width:340px;height:100vh;background:#000;position:relative;display:flex;flex-direction:column;
    justify-content:center;border-right:1px solid var(--border);}
  .player-wrapper.fullscreen{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;}
  video{width:100%;height:100%;object-fit:contain;cursor:pointer;}
  .no-signal{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    color:var(--text-dim);gap:10px;text-align:center;padding:20px;grid-column:1/-1;}
  .no-signal b{color:#fff;font-family:var(--mono);letter-spacing:.08em;font-size:.9rem;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:2000;
    background:rgba(9,40,30,.95);border:1px solid var(--border-strong);color:#fff;padding:12px 20px;
    border-radius:12px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="bg-decor"></div>
<div class="shimmer"></div>

<!-- ===== 1. الشاشة الرئيسية ===== -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-text">
        <div class="brand-logo">Montana Player</div>
        <div class="brand-sub">Legendary Mint Edition</div>
      </div>
    </div>

    <div class="clock-box">
      <div class="clock-time" id="clockTime">--:--:-- --</div>
      <div class="clock-date" id="clockDate">—</div>
    </div>

    <div class="top-actions">
      <div class="search-wrap">
        <button class="icon-btn" onclick="toggleSearch()">🔍</button>
        <input type="text" id="searchBox" class="search-input" placeholder="بحث..." oninput="filterItems(this.value)">
      </div>
      <button class="icon-btn" onclick="openPlaylistsPage()" title="القوائم">👤</button>
      <button class="icon-btn" title="الإعدادات">⚙</button>
      <button class="icon-btn" onclick="location.reload()" title="تحديث">🔄</button>
    </div>
  </div>

  <div class="cards-grid">
    <div class="tile" onclick="openSection('live')"><div class="tile-icon">📺</div><div class="tile-title">Live TV</div></div>
    <div class="tile" onclick="openSection('movies')"><div class="tile-icon">🎬</div><div class="tile-title">Movies</div></div>
    <div class="tile" onclick="openSection('series')"><div class="tile-icon">🎞️</div><div class="tile-title">Series</div></div>
    <div class="tile" onclick="openPlaylistsPage()">
      <div class="tile-badge" id="plCountBadge">0</div>
      <div class="tile-icon">📋</div><div class="tile-title">Playlist</div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="pl-summary">
      <div>القائمة الحالية: <strong id="activePlName">لا يوجد</strong></div>
      <span class="exp-tag" id="activePlExpiry" style="display:none;"></span>
    </div>
    <div class="bottom-icons">
      <button class="icon-btn" onclick="openPlaylistsPage()" title="إدارة القوائم">📋</button>
      <button class="icon-btn" onclick="location.reload()" title="تحديث">⟳</button>
    </div>
  </div>
  <div class="footer-note">Montana Player // v1.0 // Legendary Mint Edition</div>
</div>

<!-- ===== 2. صفحة القوائم ===== -->
<div class="page-overlay" id="playlistsPage">
  <div class="page-header">
    <h1><button class="btn-round" style="font-size:1.2rem;" onclick="closePlaylistsPage()">❮</button> القوائم</h1>
    <div class="btn-round" onclick="openAddModal()" title="إضافة قائمة">+</div>
  </div>
  <div class="pl-grid" id="playlistsGrid"></div>
</div>

<!-- ===== 3. مودال إضافة اكستريم ===== -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <div class="modal-title">إضافة قائمة Xtream</div>
    <div class="modal-sub">يعمل مع أي سيرفر Xtream Codes / M3U</div>
    <div class="form-grid">
      <div class="field"><label>اسم القائمة</label><input type="text" id="plName" placeholder="My IPTV"></div>
      <div class="field"><label>URL + Port</label><input type="text" id="plHost" placeholder="http://server:8080"></div>
      <div class="field"><label>اليوزر</label><input type="text" id="plUser" placeholder="username"></div>
      <div class="field"><label>الباسورد</label><input type="password" id="plPass" placeholder="password"></div>
      <div class="form-error" id="modalError"></div>
      <div class="form-btns">
        <button class="btn-primary" id="submitBtn" onclick="saveNewPlaylist()">إضافة</button>
        <button class="btn-ghost" onclick="closeAddModal()">إلغاء</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 4. مشغل المحتوى ===== -->
<div class="content-view" id="contentView">
  <div class="sidebar-mini">
    <button class="icon-btn" onclick="closeSection()">🏠</button>
    <button class="icon-btn" onclick="openSection('live')">📺</button>
    <button class="icon-btn" onclick="openSection('movies')">🎬</button>
    <button class="icon-btn" onclick="openSection('series')">🎞️</button>
  </div>
  <div class="categories-panel" id="categoriesPanel"></div>
  <div class="items-panel"><div class="items-grid" id="itemsGrid"></div></div>
  <div class="player-wrapper" id="playerWrapper">
    <video id="videoPlayer" controls autoplay onclick="toggleFullScreen()"></video>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let playlists = JSON.parse(localStorage.getItem('montana_playlists')) || [];
  let activePlaylist = playlists.find(p => p.active) || null;
  let hls = null, currentMode = null, allItemsCache = [];

  /* ===== أدوات مساعدة ===== */
  function persist(){ localStorage.setItem('montana_playlists', JSON.stringify(playlists)); }
  function escapeHtml(str){ const d=document.createElement('div'); d.innerText = str==null?'':str; return d.innerHTML; }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2600);
  }
  function normalizeHost(url){
    url = url.trim();
    if(!/^https?:\/\//i.test(url)) url = 'http://' + url;
    if(url.endsWith('/')) url = url.slice(0,-1);
    return url;
  }

  /* يمرّر أي طلب (API أو فيديو) عبر بروكسي الموقع نفسه، عشان يشتغل مع أي سيرفر
     حتى لو كان http عادي والموقع شغال https — بيحل مشكلة mixed-content وCORS */
  function px(realUrl){ return '/api/proxy?url=' + encodeURIComponent(realUrl); }

  // Loader مخصص لـ hls.js يمرر كل طلبات الـ m3u8 والـ segments عبر البروكسي كمان
  function ProxyHlsLoader(config){
    const Base = Hls.DefaultConfig.loader;
    const inner = new Base(config);
    this.load = function(context, cfg, callbacks){
      context.url = px(context.url);
      inner.load(context, cfg, callbacks);
    };
    this.abort = function(){ inner.abort && inner.abort(); };
    this.destroy = function(){ inner.destroy && inner.destroy(); };
  }

  /* ===== الساعة الرقمية 12 ساعة ===== */
  function updateClock(){
    const now = new Date();
    document.getElementById('clockTime').innerText = now.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    document.getElementById('clockDate').innerText = now.toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }
  setInterval(updateClock, 1000); updateClock();

  window.onload = () => {
    renderPlaylists();
    updateActiveUI();
    if (activePlaylist && !activePlaylist.expiry) refreshExpiry(activePlaylist);
  };

  /* ===== حالة الاشتراك (تاريخ الانتهاء) ===== */
  function expiryStatus(pl){
    if(!pl || !pl.expiry) return {cls:'', label:'جارِ التحقق...'};
    if(pl.expiry === 'unlimited') return {cls:'ok', label:'اشتراك غير محدود'};
    const days = Math.ceil((new Date(pl.expiry) - new Date()) / 86400000);
    if(days < 0) return {cls:'danger', label:`منتهي منذ ${Math.abs(days)} يوم`};
    if(days <= 7) return {cls:'warn', label:`ينتهي خلال ${days} يوم (${pl.expiry})`};
    return {cls:'ok', label:`ينتهي في ${pl.expiry}`};
  }

  function updateActiveUI(){
    document.getElementById('plCountBadge').innerText = playlists.length;
    const nameEl = document.getElementById('activePlName');
    const expEl = document.getElementById('activePlExpiry');
    if(activePlaylist){
      nameEl.innerText = activePlaylist.name;
      const st = expiryStatus(activePlaylist);
      expEl.style.display = 'inline-block';
      expEl.className = 'exp-tag ' + st.cls;
      expEl.innerText = st.label;
    } else {
      nameEl.innerText = 'لا يوجد';
      expEl.style.display = 'none';
    }
  }

  /* ===== التنقل ===== */
  function openPlaylistsPage(){ document.getElementById('playlistsPage').style.display='flex'; renderPlaylists(); }
  function closePlaylistsPage(){ document.getElementById('playlistsPage').style.display='none'; }
  function openAddModal(){ document.getElementById('modalError').innerText=''; document.getElementById('addModal').style.display='flex'; }
  function closeAddModal(){
    document.getElementById('addModal').style.display='none';
    ['plName','plHost','plUser','plPass'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('modalError').innerText='';
  }
  function toggleSearch(){
    const box = document.getElementById('searchBox');
    box.classList.toggle('open');
    if(box.classList.contains('open')) box.focus(); else box.value='';
  }
  function filterItems(q){
    q = q.trim().toLowerCase();
    const filtered = q ? allItemsCache.filter(it => (it.name||it.title||'').toLowerCase().includes(q)) : allItemsCache;
    renderItems(filtered.slice(0,80));
  }

  /* ===== عرض القوائم ===== */
  function renderPlaylists(){
    const grid = document.getElementById('playlistsGrid');
    grid.innerHTML = '';
    if(playlists.length === 0){
      grid.innerHTML = `<div class="empty-box"><b>لا توجد قوائم بعد</b>اضغط + لإضافة أول قائمة Xtream</div>`;
      return;
    }
    playlists.forEach((pl,i)=>{
      const st = expiryStatus(pl);
      const card = document.createElement('div');
      card.className = 'pl-card' + (pl.active ? ' active' : '');
      card.innerHTML = `
        <div class="pl-top">
          <div>
            <div class="pl-title">${escapeHtml(pl.name)}</div>
            <div class="pl-url">${escapeHtml(pl.host)}</div>
          </div>
          <div class="pl-dot"></div>
        </div>
        <span class="exp-tag ${st.cls}">${st.label}</span>
        <div class="pl-actions">
          <button class="mini-btn" data-a="select">تفعيل</button>
          <button class="mini-btn" data-a="refresh">تحديث الاشتراك</button>
          <button class="mini-btn danger" data-a="delete">حذف</button>
        </div>`;
      card.querySelector('[data-a="select"]').onclick = e=>{e.stopPropagation(); selectPlaylist(i);};
      card.querySelector('[data-a="delete"]').onclick = e=>{e.stopPropagation(); deletePlaylist(i);};
      card.querySelector('[data-a="refresh"]').onclick = e=>{e.stopPropagation(); refreshExpiry(pl);};
      grid.appendChild(card);
    });
  }

  function selectPlaylist(i){
    playlists.forEach(p=>p.active=false);
    playlists[i].active = true;
    activePlaylist = playlists[i];
    persist(); renderPlaylists(); updateActiveUI(); closePlaylistsPage();
    showToast(`تم تفعيل: ${activePlaylist.name}`);
    if(!activePlaylist.expiry) refreshExpiry(activePlaylist);
  }

  function deletePlaylist(i){
    const wasActive = playlists[i].active;
    const name = playlists[i].name;
    playlists.splice(i,1);
    if(wasActive){ activePlaylist = playlists[0] || null; if(activePlaylist) activePlaylist.active = true; }
    persist(); renderPlaylists(); updateActiveUI();
    showToast(`تم حذف: ${name}`);
  }

  /* ===== إضافة + التحقق من الاشتراك ===== */
  async function saveNewPlaylist(){
    const name = document.getElementById('plName').value.trim();
    let host = document.getElementById('plHost').value.trim();
    const user = document.getElementById('plUser').value.trim();
    const pass = document.getElementById('plPass').value.trim();
    const err = document.getElementById('modalError');
    const btn = document.getElementById('submitBtn');
    err.innerText = '';
    if(!name || !host){ err.innerText = 'يرجى ملء اسم القائمة والرابط'; return; }
    host = normalizeHost(host);

    const newPl = {name, host, user, pass, active:true, expiry:null};
    btn.disabled = true; btn.innerText = 'جارِ التحقق...';
    const info = await tryFetchAccountInfo(newPl);
    if(info.ok) newPl.expiry = info.expiry;
    else err.innerText = 'تمت الإضافة، لكن تعذّر التحقق من الاشتراك الآن';

    playlists.forEach(p=>p.active=false);
    playlists.push(newPl);
    activePlaylist = newPl;
    persist(); renderPlaylists(); updateActiveUI();
    btn.disabled = false; btn.innerText = 'إضافة';
    closeAddModal();
    showToast(`تمت إضافة: ${name}`);
  }

  async function refreshExpiry(pl){
    const info = await tryFetchAccountInfo(pl);
    if(info.ok){ pl.expiry = info.expiry; persist(); renderPlaylists(); updateActiveUI(); showToast('تم تحديث بيانات الاشتراك'); }
    else showToast('تعذّر الاتصال بالسيرفر');
  }

  async function tryFetchAccountInfo(pl){
    try{
      const target = `${pl.host}/player_api.php?username=${encodeURIComponent(pl.user)}&password=${encodeURIComponent(pl.pass)}`;
      const res = await fetch(px(target));
      const data = await res.json();
      const info = data && data.user_info;
      if(!info) return {ok:false};
      if(!info.exp_date) return {ok:true, expiry:'unlimited'};
      const d = new Date(parseInt(info.exp_date,10)*1000);
      const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
      return {ok:true, expiry:`${y}-${m}-${day}`};
    }catch(e){ return {ok:false}; }
  }

  /* ===== فتح الأقسام ===== */
  async function openSection(mode){
    if(!activePlaylist){ openPlaylistsPage(); showToast('فعّل قائمة أولاً'); return; }
    currentMode = mode;
    document.getElementById('contentView').style.display = 'flex';
    document.getElementById('itemsGrid').innerHTML = `<div class="no-signal"><b>جارِ التحميل...</b></div>`;

    const base = `${activePlaylist.host}/player_api.php?username=${encodeURIComponent(activePlaylist.user)}&password=${encodeURIComponent(activePlaylist.pass)}`;
    let catAction = mode==='movies' ? 'get_vod_categories' : (mode==='series' ? 'get_series_categories' : 'get_live_categories');
    let itemAction = mode==='movies' ? 'get_vod_streams' : (mode==='series' ? 'get_series' : 'get_live_streams');

    try{
      const [catRes,itemRes] = await Promise.all([fetch(px(`${base}&action=${catAction}`)), fetch(px(`${base}&action=${itemAction}`))]);
      const cats = await catRes.json();
      const items = await itemRes.json();
      allItemsCache = Array.isArray(items) ? items : [];
      renderCategories(Array.isArray(cats) ? cats : []);
      renderItems(allItemsCache.slice(0,80));
    }catch(err){
      document.getElementById('categoriesPanel').innerHTML = '';
      document.getElementById('itemsGrid').innerHTML = `<div class="no-signal"><b>تعذّر الاتصال</b><span>تحقق من بيانات السيرفر</span></div>`;
    }
  }

  function closeSection(){
    document.getElementById('contentView').style.display='none';
    const v = document.getElementById('videoPlayer');
    if(hls){ hls.destroy(); hls=null; }
    v.pause(); v.removeAttribute('src'); v.load();
  }

  function renderCategories(cats){
    const panel = document.getElementById('categoriesPanel');
    panel.innerHTML = '';
    const all = document.createElement('div');
    all.className = 'cat-item active'; all.innerText = 'الكل';
    all.onclick = ()=>{ [...panel.children].forEach(c=>c.classList.remove('active')); all.classList.add('active'); renderItems(allItemsCache.slice(0,80)); };
    panel.appendChild(all);
    cats.forEach(c=>{
      const item = document.createElement('div');
      item.className = 'cat-item'; item.innerText = c.category_name;
      item.onclick = ()=>{
        [...panel.children].forEach(el=>el.classList.remove('active')); item.classList.add('active');
        renderItems(allItemsCache.filter(it=>it.category_id===c.category_id).slice(0,80));
      };
      panel.appendChild(item);
    });
  }

  function renderItems(items){
    const grid = document.getElementById('itemsGrid');
    grid.innerHTML = '';
    if(!items || items.length===0){ grid.innerHTML = `<div class="no-signal"><b>لا يوجد محتوى</b></div>`; return; }
    items.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'grid-card';
      const title = item.name || item.title || 'بدون اسم';
      const img = item.stream_icon || item.cover || '';
      card.innerHTML = `<img src="${img}" onerror="this.style.opacity=0.15" alt=""><span>${escapeHtml(title)}</span>`;
      card.onclick = ()=> playItem(item);
      grid.appendChild(card);
    });
  }

  function playItem(item){
    if(!activePlaylist) return;
    let url = '';
    if(currentMode==='live') url = `${activePlaylist.host}/live/${activePlaylist.user}/${activePlaylist.pass}/${item.stream_id}.m3u8`;
    else if(currentMode==='movies') url = `${activePlaylist.host}/movie/${activePlaylist.user}/${activePlaylist.pass}/${item.stream_id}.${item.container_extension||'mp4'}`;
    else return;
    const video = document.getElementById('videoPlayer');
    if(hls){ hls.destroy(); hls=null; }
    if(url.endsWith('.m3u8') && Hls.isSupported()){
      hls = new Hls({ loader: ProxyHlsLoader });
      hls.loadSource(url);
      hls.attachMedia(video);
    } else {
      video.src = px(url);
    }
    video.play().catch(()=>{});
  }

  function toggleFullScreen(){ document.getElementById('playerWrapper').classList.toggle('fullscreen'); }

  if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
