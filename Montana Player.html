<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Montana Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #134e4a, #064e3b, #022c22);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 35px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 26px;
      font-weight: bold;
      color: #a7f3d0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-actions {
      display: flex;
      gap: 15px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .top-actions i {
      font-size: 20px;
      cursor: pointer;
      color: #ecfdf5;
      transition: all 0.2s ease;
    }

    .top-actions i:hover {
      transform: scale(1.2);
      color: #34d399;
    }

    /* Dashboard Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-gap: 18px;
      height: 65%;
      margin: 15px 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .card:hover, .card:focus {
      background: rgba(52, 211, 153, 0.25);
      border-color: #34d399;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(52, 211, 153, 0.3);
      outline: none;
    }

    .card i { font-size: 50px; margin-bottom: 12px; color: #ffffff; }
    .card span { font-size: 20px; font-weight: bold; color: #ffffff; }

    .sub-grid { display: grid; grid-template-rows: 2fr 1fr 1fr; gap: 12px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-2 .card i, .sub-grid .card i { font-size: 26px; margin-bottom: 0; margin-left: 8px; }
    .row-2 .card, .sub-grid .card { flex-direction: row; }

    /* Bottom Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #a7f3d0;
    }

    .playlist-info p span { color: #ffffff; font-weight: bold; }
    .system-controls { display: flex; gap: 12px; }

    .btn-circle {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(5px);
    }
    .btn-circle:hover { background: #34d399; color: #064e3b; }

    /* Screens & Player Interface */
    .view-screen {
      display: none; position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #022c22; z-index: 1000;
      flex-direction: column; padding: 15px;
    }

    .player-header {
      display: flex; justify-content: space-between; align-items: center;
      height: 50px; border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px; margin-bottom: 10px;
    }

    .player-body {
      display: grid;
      grid-template-columns: 280px 320px 1fr;
      gap: 15px;
      height: calc(100vh - 90px);
    }

    /* Category & Channels Lists */
    .panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow-y: auto;
      padding: 10px;
    }

    .panel-item {
      padding: 12px; border-radius: 8px; margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.03); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: 0.2s;
    }

    .panel-item:hover, .panel-item.active {
      background: #34d399; color: #064e3b; font-weight: bold;
    }

    /* Video Player Box */
    .video-container {
      background: #000; border-radius: 12px; overflow: hidden;
      position: relative; display: flex; justify-content: center; align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* Fullscreen Mode */
    .video-container.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 9999; border-radius: 0;
    }

    .expand-hint {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,0.6); padding: 5px 10px;
      border-radius: 5px; font-size: 12px; pointer-events: none;
    }

    /* Modals & Loading */
    .modal {
      display: none; position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 47, 38, 0.9); backdrop-filter: blur(10px);
      justify-content: center; align-items: center; z-index: 2000;
    }

    .modal-content {
      background: #064e3b; padding: 30px; border-radius: 20px;
      width: 420px; border: 1px solid #34d399;
    }

    .input-group { margin-bottom: 14px; }
    .input-group input {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid #047857; background: #022c22; color: #fff; outline: none;
    }

    .btn-submit {
      width: 100%; padding: 12px; background: #34d399; color: #064e3b;
      border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
    }

    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 44, 34, 0.95); z-index: 3000;
      flex-direction: column; justify-content: center; align-items: center;
    }

    .spinner {
      width: 60px; height: 60px; border: 6px solid rgba(255,255,255,0.1);
      border-top-color: #34d399; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand"><i class="fa-solid fa-tv"></i> Montana Player</div>
    <div class="top-actions">
      <i class="fa-solid fa-plus" onclick="openAddModal()" title="إضافة سيرفر"></i>
      <i class="fa-solid fa-list-check" onclick="openPlaylistsModal()" title="إدارة القوائم"></i>
    </div>
  </div>

  <!-- Dashboard Grid -->
  <div class="main-grid">
    <div class="sub-grid">
      <div class="card" onclick="openPlayerView('live')" tabindex="1"><i class="fa-solid fa-tv"></i><span>Live TV</span></div>
      <div class="card" onclick="openPlayerView('catchup')" tabindex="2"><i class="fa-solid fa-clock-rotate-left"></i><span>Catch Up</span></div>
      <div class="row-2">
        <div class="card" onclick="openPlayerView('fav')" tabindex="3"><i class="fa-solid fa-bookmark"></i><span>Favorites</span></div>
        <div class="card" onclick="openPlaylistsModal()" tabindex="4"><i class="fa-solid fa-list-check"></i><span>Playlists</span></div>
      </div>
    </div>
    <div class="card" onclick="openPlayerView('movies')" tabindex="5"><i class="fa-solid fa-film"></i><span>Movies</span></div>
    <div class="card" onclick="openPlayerView('series')" tabindex="6"><i class="fa-solid fa-clapperboard"></i><span>Series</span></div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="playlist-info">
      <p>Current Playlist: <span id="current-playlist-name">لا يوجد (اضغط + لإضافة سيرفر)</span></p>
    </div>
    <div class="system-controls">
      <button class="btn-circle" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>

  <!-- Full Player View (الشاشة الرئيسية للبث والأقسام) -->
  <div class="view-screen" id="playerView">
    <div class="player-header">
      <h3 id="sectionTitle" style="color: #34d399;">Live TV</h3>
      <button class="btn-circle" onclick="closePlayerView()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="player-body">
      <!-- 1. الأقسام Categories -->
      <div class="panel" id="categoriesContainer"></div>
      
      <!-- 2. القنوات Channels -->
      <div class="panel" id="channelsContainer">
        <p style="text-align:center; opacity:0.5; margin-top:20px;">اختر قسماً لعرض القنوات</p>
      </div>

      <!-- 3. شاشة المعاينة / الفيديو Mini Player -->
      <div class="video-container" id="videoBox" onclick="toggleFullscreen()">
        <span class="expand-hint">اضغط للتكبير ⛶</span>
        <video id="mainVideo" controls autoplay></video>
      </div>
    </div>
  </div>

  <!-- Loading Overlay (شاشة التحميل) -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <h2 style="color:#34d399;">Loading...</h2>
    <p style="opacity:0.8; margin-top:5px;">جاري جلب القنوات والمحتوى من السيرفر</p>
  </div>

  <!-- Modal: إضافة سيرفر -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px; text-align:center; color:#a7f3d0;">إضافة سيرفر IPTV</h3>
      <div class="input-group"><input type="text" id="pName" placeholder="اسم السيرفر"></div>
      <div class="input-group"><input type="text" id="pUrl" placeholder="Host (http://domain.com:8080)"></div>
      <div class="input-group"><input type="text" id="pUser" placeholder="Username"></div>
      <div class="input-group"><input type="password" id="pPass" placeholder="Password"></div>
      <button class="btn-submit" onclick="saveAndFetchData()">حفظ وجلب البيانات فوراً</button>
      <button class="btn-submit" style="background:transparent; color:#fff;" onclick="closeModal('addModal')">إلغاء</button>
    </div>
  </div>

  <!-- HLS.js لتشغيل البث المباشر m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    let playlists = JSON.parse(localStorage.getItem('montana_playlists')) || [];
    let activePlaylist = JSON.parse(localStorage.getItem('montana_active_data')) || null;
    let serverData = { categories: [], streams: [] };
    let hls = new Hls();

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // حفظ السيرفر وسحب المحتوى فوراً (Loading)
    function saveAndFetchData() {
      const name = document.getElementById('pName').value.trim();
      const url = document.getElementById('pUrl').value.trim();
      const user = document.getElementById('pUser').value.trim();
      const pass = document.getElementById('pPass').value.trim();

      if(!name || !url || !user || !pass) return alert('الرجاء تعبئة كافة البيانات');

      activePlaylist = { name, url, user, pass };
      playlists.push(activePlaylist);
      localStorage.setItem('montana_playlists', JSON.stringify(playlists));
      localStorage.setItem('montana_active_data', JSON.stringify(activePlaylist));

      document.getElementById('current-playlist-name').innerText = name;
      closeModal('addModal');
      
      // بدء التحميل الفوري
      fetchAllData();
    }

    // سحب الأقسام والقنوات دفعة واحدة
    function fetchAllData() {
      if(!activePlaylist) return;
      document.getElementById('loadingOverlay').style.display = 'flex';

      const catUrl = `${activePlaylist.url}/player_api.php?username=${activePlaylist.user}&password=${activePlaylist.pass}&action=get_live_categories`;
      const streamUrl = `${activePlaylist.url}/player_api.php?username=${activePlaylist.user}&password=${activePlaylist.pass}&action=get_live_streams`;

      Promise.all([fetch(catUrl).then(r => r.json()), fetch(streamUrl).then(r => r.json())])
        .then(([categories, streams]) => {
          serverData.categories = categories;
          serverData.streams = streams;
          document.getElementById('loadingOverlay').style.display = 'none';
        })
        .catch(err => {
          document.getElementById('loadingOverlay').style.display = 'none';
          alert('حدث خطأ أثناء تحميل البيانات من السيرفر');
        });
    }

    // فتح واجهة المشغل للأقسام
    function openPlayerView(type) {
      if(!activePlaylist) return alert('قم بإضافة سيرفر أولاً!');
      if(serverData.categories.length === 0) {
        fetchAllData();
        return;
      }
      
      document.getElementById('playerView').style.display = 'flex';
      renderCategories();
    }

    function closePlayerView() {
      document.getElementById('playerView').style.display = 'none';
      const video = document.getElementById('mainVideo');
      video.pause();
    }

    // عرض الأقسام Categories
    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      
      serverData.categories.forEach((cat, index) => {
        const div = document.createElement('div');
        div.className = 'panel-item';
        div.innerText = cat.category_name;
        div.onclick = () => {
          document.querySelectorAll('#categoriesContainer .panel-item').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          renderChannels(cat.category_id);
        };
        container.appendChild(div);
      });
    }

    // عرض قنوات القسم المختار
    function renderChannels(catId) {
      const container = document.getElementById('channelsContainer');
      container.innerHTML = '';
      
      const filteredStreams = serverData.streams.filter(s => s.category_id === catId);
      
      if(filteredStreams.length === 0) {
        container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:20px;">لا توجد قنوات في هذا القسم</p>';
        return;
      }

      filteredStreams.forEach(stream => {
        const div = document.createElement('div');
        div.className = 'panel-item';
        div.innerHTML = `<span>${stream.name}</span> <i class="fa-solid fa-play"></i>`;
        div.onclick = () => playStream(stream.stream_id);
        container.appendChild(div);
      });
    }

    // تشغيل القناة المباشرة في شاشة المعاينة
    function playStream(streamId) {
      const streamUrl = `${activePlaylist.url}/live/${activePlaylist.user}/${activePlaylist.pass}/${streamId}.m3u8`;
      const video = document.getElementById('mainVideo');

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play();
      }
    }

    // تكبير الشاشة وإغلاقها عند النقر
    function toggleFullscreen() {
      const box = document.getElementById('videoBox');
      box.classList.toggle('fullscreen');
    }

    // زر ESC للخروج من الشاشة الكاملة
    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape") {
        document.getElementById('videoBox').classList.remove('fullscreen');
      }
    });

    // تشغيل القائمة الحالية عند الفتح
    if(activePlaylist) {
      document.getElementById('current-playlist-name').innerText = activePlaylist.name;
      fetchAllData();
    }
  </script>
</body>
</html>
